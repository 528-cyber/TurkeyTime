<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanksgiving Turkey Lugia Disguise</title>

    <style>
        html,
        body {
            overflow: hidden;
            background: #43B3AE;
        }

        .cartoon {
            --blue2: #8DA7D8;
            --white1: #EFF0F7;
            --orange1: orange;
            --blue1: #54609F;
            width: 80vmin;
            height: 80vmin;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }


        .cartoon div {
            position: absolute;
            box-sizing: border-box;
        }

        .body {
            width: 40%;
            height: 40%;
            background: var(--blue2);
            color: var(--blue2);
            border-radius: 50%;

            top: 40%;
            left: 50%;
            transform: translate(-50%, 0);

            box-shadow:
                -4vmin 14.5vmin 0 -13vmin,
                4vmin 14.5vmin 0 -13vmin
        }

        .wing {
            height: 40%;
            width: 20%;
            background: var(--white1);
            border-radius: 100% 0% 70% 5%;
            top: 41%;
            left: 23%;
            transform-origin: top right;
            transform: rotate(3deg);
            overflow: visible;
        }


        .wing+.wing {
            left: auto;
            right: 43%;
            transform: scaleX(-1) rotate(3deg);
        }

        /*creates wing "fingers" with extra divs*/

        .wing-finger {
            position: absolute;
            width: 60%;
            height: 15%;
            background: var(--white1);
            border-radius: 20% / 170% 170% 170% 170%;
            transform-origin: left center;
        }

        .finger1 {
            left: -15%;
            top: 105%;
            transform: rotate(-60deg);
        }

        .finger2 {
            left: 20%;
            top: 115%;
            transform: rotate(-80deg);
        }

        .finger3 {
            left: 65%;
            top: 110%;
            transform: rotate(-100deg);
        }


        .head {
            width: 19%;
            height: 19%;
            border-radius: 50%;
            background: var(--white1);
            top: 15%;
            left: 50%;
            transform: translate(-50%, 0);
            clip-path: polygon(0% 20%, 100% 20%, 100% 500%, 0% 500%);
        }


        .head::before {
            content: "";
            display: block;
            position: absolute;
            width: 40%;
            height: 120%;
            background: var(--white1);
            top: 80%;
            left: 50%;
            transform: translate(-50%, 0);
            border-radius: 0 0 100% 100% / 100%;
        }

        .eye {
            width: 8%;
            height: 8%;
            background: black;
            border-radius: 50%;
            top: 45%;
            left: 50%;
            transform: translate(-50%, 0) translate(-2.5vmin, 0);
            z-index: 3;
            box-shadow: 5vmin 0
        }

        /*creates whites of eyes and eye things that are on Lugia's head*/

        .eyewhite {
            position: absolute;
            width: 50%;
            height: 30%;
            background: var(--white1);
            left: 5%;
            top: 33%;
            border-radius: 0 100% 0 0;
            transform: scale(0.4);
            z-index: 2;
        }

        .eyewhite::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--white1);
            left: 200%;
            transform: scaleX(-1);
            border-radius: 0 100% 0 0;
        }

        .eyething {
            position: absolute;
            width: 50%;
            height: 30%;
            background: var(--blue1);
            left: -5%;
            top: 27%;
            border-radius: 0 100% 0 0;
        }

        .eyething::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--blue1);
            left: 120%;
            transform: scaleX(-1);
            border-radius: 0 100% 0 0;
        }

        .beak {
            width: 4vmin;
            height: 3vmin;
            border-left: 4vmin solid var(--orange1);
            border-top: 1.5vmin solid transparent;
            border-bottom: 1.5vmin solid transparent;
            top: 60%;
            left: 50%;
        }


        .red {
            width: 2.5vmin;
            height: 6vmin;
            background: #d00;
            border-radius: 100% / 100% 0 100% 100%;
            top: 60%;
            left: 50%;
            transform: translate(-100%, 0);
        }


        .leg {
            width: 3%;
            height: 21%;
            background: var(--white1);
            top: 79%;
            left: 50%;
            transform: translate(-50%, 0) translate(-4vmin, 0);
            border-radius: 5vmin / 50%;
            background-image:
                repeating-linear-gradient(transparent 0 10%, rgba(0, 0, 0, 0.1) 0 11%);
        }

        .leg+.leg {
            transform: translate(-50%, 0) translate(4vmin, 0);
        }


        .leg::before,
        .leg::after {
            content: "";
            display: block;
            position: absolute;
            width: 80%;
            height: 35%;
            left: 50%;
            bottom: 0;
            background: var(--white1);
            border-radius: 5vmin;
            transform-origin: 50% 0;
            transform: translate(-50%, 0) rotate(30deg);
        }

        .leg::after {
            transform: translate(-50%, 0) rotate(-30deg);
        }


        .hat-bottom {
            width: 25%;
            height: 8%;
            border-radius: 200%;
            background: var(--white1);
            top: 15%;
            left: 46%;
            transform: translate(-50%, 0);
        }
        

        /*decreased number of tails to match lugia's back spines. also changes shape slightly*/


        .tail {
            width: 10%;
            height: 30%;
            background: var(--blue1);
            border-radius: 20% / 10% 10% 170% 170%;

            transform-origin: 50% 100%;
            top: 30%;
            left: 50%;
            transform: translate(-50%, 0);
        }


        .tail:nth-child(1) {
            transform: translate(-50%, 0) rotate(0);
        }

        .tail:nth-child(2) {
            transform: translate(-50%, 0) rotate(34deg);
        }

        .tail:nth-child(3) {
            transform: translate(-50%, 0) rotate(68deg);
        }

        .tail:nth-child(4) {
            transform: translate(-50%, 0) rotate(102deg);
        }

        .tail:nth-child(5) {
            transform: translate(-50%, 0) rotate(-34deg);
        }

        .tail:nth-child(6) {
            transform: translate(-50%, 0) rotate(-68deg);
        }

        .tail:nth-child(7) {
            transform: translate(-50%, 0) rotate(-102deg);
        }
    </style>
</head>

<body>
    <div class="cartoon">
        <div class="tail2"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="leg"></div>
        <div class="leg"></div>
        <div class="body"></div>
        <div class="wing">
            <div class="wing-finger finger1"></div>
            <div class="wing-finger finger2"></div>
            <div class="wing-finger finger3"></div>
        </div>

        <div class="wing">
            <div class="wing-finger finger1"></div>
            <div class="wing-finger finger2"></div>
            <div class="wing-finger finger3"></div>
        </div>
        <div class="hat-top"></div>
        <div class="hat-bottom"></div>
        <div class="head">
            <div class="eye"></div>
            <div class="eyewhite"></div>
            <div class="eyething"></div>
            <div class="beak"></div>
            <div class="red"></div>
        </div>
    </div>


</body>

</html>
